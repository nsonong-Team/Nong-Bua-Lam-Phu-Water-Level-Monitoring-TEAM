<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <title>ระบบเฝ้าระวังสถานการณ์น้ำ จ.หนองบัวลำภู</title>

    <link rel="icon" href="data:image/svg+xml,
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
            <text y='.9em' font-size='90'>🌊</text>
        </svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/sidebar.css">
    <link rel="stylesheet" href="styles/forms.css">
    <link rel="stylesheet" href="styles/map.css">
    <link rel="stylesheet" href="styles/responsive.css">
</head>

<body>
    <div class="topbar">
        <div class="tb-l">
            <div class="logo">🌊</div>
            <div>
                <div class="tb-t">ระบบเฝ้าระวังสถานการณ์น้ำ จ.หนองบัวลำภู</div>
                <div class="tb-s">Nong Bua Lam Phu Water Level Monitoring</div>
            </div>
        </div>

        <div class="tb-r">
            <div class="live">
                <span class="ld"></span>REALTIME
            </div>
            <div class="clk" id="clk"></div>
        </div>
    </div>

    <div class="top-menu">
        <div class="nav-select-wrap">
            <span class="nav-icon">🌊</span>
            <select class="nav-select" onchange="if(this.value) { window.open(this.value,'_blank'); this.value=''; }">
            <option value="">เลือกหน้า...</option>
            <option value="https://nsonong-team.github.io/measuring-water-level-paneang-TEAM/">ลำน้ำพะเนียง</option>
            <option value="https://nsonong-team.github.io/measuring-water-level-mong-TEAM/">ลำน้ำโมง</option>
            <option value="water-level-chart.html">กราฟระดับน้ำ</option>
            </select>
            <span class="nav-caret">▾</span>
        </div>
    </div>

    <div class="alrt" id="ab">
        <span class="alrt-p">⚠️</span>
        <span id="at"></span>
    </div>

    <div class="main">

        <!-- Sidebar -->
        <div class="sb" id="sb">

            <div class="sb-kpi">
                <div class="kpi">
                    <div class="kn" style="color:var(--w3)" id="k0">12</div>
                    <div class="kl">สถานีทั้งหมด</div>
                </div>

                <div class="kpi">
                    <div class="kn" style="color:var(--gn)" id="k1">0</div>
                    <div class="kl">ปกติ</div>
                </div>

                <div class="kpi">
                    <div class="kn" style="color:var(--yl)" id="k2">0</div>
                    <div class="kl">เฝ้าระวัง</div>
                </div>

                <div class="kpi">
                    <div class="kn" style="color:var(--rd)" id="k3">0</div>
                    <div class="kl">วิกฤติ</div>
                </div>
            </div>

            <div class="sb-tabs">
                <button class="sbt on" onclick="swP('st',this)">📋 สถานี</button>
                <button class="sbt" onclick="swP('rp',this)">📝 รายงาน</button>
                <button class="sbt" onclick="swP('cf',this)">⚙️ ตั้งค่า</button>
            </div>

            <!-- Page: Stations -->
            <div class="sbp on" id="p-st">
                <div class="sbs">
                    <div class="sbt2">🌊 ลำน้ำพะเนียง — 10 สถานี</div>
                    <div id="lP"></div>
                </div>

                <div class="sbs">
                    <div class="sbt2">🌊 ลำน้ำโมง — 2 สถานี</div>
                    <div id="lM"></div>
                </div>
            </div>

            <!-- Page: Report -->
            <div class="sbp" id="p-rp">
                <div class="sbs">

                    <div class="sbt2">📝 รายงานสถานการณ์น้ำ</div>

                    <div class="fr">
                        <div class="fg">
                            <label class="fl">วันที่</label>
                            <input type="date" class="fi" id="fD">
                        </div>

                        <div class="fg">
                            <label class="fl">เวลา</label>
                            <input type="time" class="fi" id="fT" value="08:00">
                        </div>
                    </div>

                    <div class="fr">
                        <div class="fg">
                            <label class="fl">ลำน้ำ</label>
                            <select class="fs" id="fR">
                                <option value="">-- เลือก --</option>
                                <option value="paneang">ลำน้ำพะเนียง</option>
                                <option value="mong">ลำน้ำโมง</option>
                            </select>
                        </div>

                        <div class="fg">
                            <label class="fl">สถานี</label>
                            <select class="fs" id="fS">
                                <option value="">-- เลือก --</option>
                            </select>
                        </div>
                    </div>

                    <div class="fr">
                        <div class="fg">
                            <label class="fl">ระดับน้ำ (ม.รทก.)</label>
                            <input type="number" step="0.1" class="fi" id="fL" placeholder="เช่น 289.2">
                        </div>

                        <div class="fg">
                            <label class="fl">สถานะ (อัตโนมัติ)</label>
                            <div class="stb" id="fSt" style="background:var(--w7);color:var(--tx4)">—</div>
                        </div>
                    </div>

                    <div class="fg">
                        <label class="fl">สภาพอากาศ</label>
                        <select class="fs" id="fW">
                            <option value="">-- เลือก --</option>
                            <option>☀️ แดดจัด</option>
                            <option>⛅ มีเมฆ</option>
                            <option>🌦️ ฝนเล็กน้อย</option>
                            <option>🌧️ ฝนปานกลาง</option>
                            <option>⛈️ ฝนหนัก</option>
                            <option>🌪️ พายุฝน</option>
                            <option>🌀 พายุฤดูร้อน</option>
                            <option>🌀 พายุดีเปรสชัน</option>
                        </select>
                    </div>

                    <div class="fr">
                        <div class="fg">
                            <label class="fl">น้ำฝนสะสม (มม.)</label>
                            <input type="number" step="0.1" class="fi" id="fRn" placeholder="45.5">
                        </div>

                        <div class="fg">
                            <label class="fl">แนวโน้ม</label>
                            <select class="fs" id="fTr">
                                <option value="">-- เลือก --</option>
                                <option>📈 เพิ่มขึ้น</option>
                                <option>➡️ ทรงตัว</option>
                                <option>📉 ลดลง</option>
                            </select>
                        </div>
                    </div>

                    <div class="fg">
                        <label class="fl">หมายเหตุ</label>
                        <textarea class="ft" id="fN" rows="2" placeholder="เช่น น้ำเอ่อล้นตลิ่ง..."></textarea>
                    </div>

                    <div class="br">
                        <button class="btn bs" onclick="clrF()">ล้าง</button>
                        <button class="btn bp" onclick="subR()">📤 บันทึก</button>
                    </div>
                </div>

                <div class="sbs">
                    <div class="sbt2">📄 ประวัติ</div>
                    <div id="rL" style="font-size:11px;color:var(--tx4)">ยังไม่มีรายงาน</div>
                </div>
            </div>

            <!-- Page: Config -->
            <div class="sbp" id="p-cf">
                <div class="sbs">
                    <div class="sbt2">⚙️ เชื่อมต่อ Google Sheets</div>

                    <div class="fg">
                        <label class="fl">Apps Script URL</label>
                        <input type="url" class="fi" id="cU" placeholder="https://script.google.com/macros/s/...">
                    </div>

                    <div class="fg">
                        <label class="fl">Refresh (วินาที)</label>
                        <input type="number" class="fi" id="cI" value="30" min="10">
                    </div>

                    <div class="br">
                        <button class="btn bp" onclick="svCfg()">💾 บันทึก</button>
                    </div>

                    <div class="cs" id="cS" style="background:var(--w7);color:var(--tx4)">
                        ⚪ ยังไม่ได้เชื่อมต่อ
                    </div>
                </div>
            </div>
        </div>

        <!-- Map -->
        <div class="mw">
            <div id="map"></div>

            <div class="wbg">
                <div class="ww"></div>
            </div>

            <button class="mobtn" onclick="document.getElementById('sb').classList.toggle('mob')">
                ☰ เมนู
            </button>
        </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="scripts/data.js"></script>
    <script src="scripts/state.js"></script>
    <script src="scripts/map.js"></script>
    <script src="scripts/reports.js"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/app.js"></script>
</body>
</html>
